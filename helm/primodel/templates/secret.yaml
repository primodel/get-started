{{- if not .Values.secrets.existingSecret -}}
{{- if not .Values.secrets.encryptionKey }}{{ fail "secrets.encryptionKey is required" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "primodel.fullname" . }}
  labels:
    {{- include "primodel.labels" . | nindent 4 }}
type: Opaque
stringData:
  PRIMODEL_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- with .Values.secrets.databaseUrl }}
  PRIMODEL_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapPassword }}
  PRIMODEL_BOOTSTRAP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidc.clientSecret }}
  PRIMODEL_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3.accessKey }}
  PRIMODEL_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3.secretKey }}
  PRIMODEL_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
