apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "primodel.fullname" . }}
  labels:
    {{- include "primodel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "primodel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "primodel.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "primodel.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.worker.enabled }}
            # Split topology: this Deployment runs role=api (HTTP/GraphQL/MCP only, no workers).
            # At least one role=worker Deployment must be running to process ingestion/integration jobs.
            - name: PRIMODEL_ROLE
              value: "api"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "primodel.fullname" . }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (include "primodel.fullname" .) }}
          readinessProbe:
            httpGet:
              path: /api/app-info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app-info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (and (eq .Values.config.storage "filesystem") .Values.persistence.enabled) .Values.config.tomlOverlay }}
          volumeMounts:
            {{- if and (eq .Values.config.storage "filesystem") .Values.persistence.enabled }}
            - name: object-store
              mountPath: {{ .Values.config.storagePath | quote }}
            {{- end }}
            {{- if .Values.config.tomlOverlay }}
            - name: primodel-toml
              mountPath: /etc/primodel/primodel.toml
              subPath: primodel.toml
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and (eq .Values.config.storage "filesystem") .Values.persistence.enabled) .Values.config.tomlOverlay }}
      volumes:
        {{- if and (eq .Values.config.storage "filesystem") .Values.persistence.enabled }}
        - name: object-store
          persistentVolumeClaim:
            claimName: {{ include "primodel.fullname" . }}-data
        {{- end }}
        {{- if .Values.config.tomlOverlay }}
        - name: primodel-toml
          configMap:
            name: {{ include "primodel.fullname" . }}-toml
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
