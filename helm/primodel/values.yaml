# Default values for the primodel chart.
# This is a YAML-formatted file. Values are declared once here and referenced
# from the templates. Anything you want to change per-install goes here (or in a
# -f override file / --set flag).
#
# ── Deployment modes ──────────────────────────────────────────────────────────
# Primodel supports three process roles via the PRIMODEL_ROLE environment variable:
#
#   all (default)   Single Deployment — all subsystems in one pod.
#                   DB migrations, admin seeding, API, workers, scheduler, streaming
#                   supervisor run in the same process. Simplest to operate.
#
#   api             API-only Deployment — HTTP/GraphQL/MCP endpoints only.
#                   No background workers; push requests queue durably on NATS.
#                   MUST be paired with at least one role=worker Deployment.
#
#   worker          Worker-only Deployment — ingestion engine, scheduler, and
#                   streaming supervisor. No HTTP endpoints except /health/*.
#                   Health port (8080) exposes only /health/live and /health/ready.
#
# To enable the split api+worker topology, set:
#   worker.enabled: true
#
# The api Deployment will then set PRIMODEL_ROLE=api; the worker Deployment will
# set PRIMODEL_ROLE=worker. Each can be scaled and scheduled independently.
# ──────────────────────────────────────────────────────────────────────────────

# -- Number of Primodel application replicas (role=all, or role=api when worker.enabled=true).
# DB migrations and admin seeding run on startup; multiple replicas share the same DB.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/primodel/primodel
  # -- Image tag. Leave empty ("") to fall back to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets used to pull the image from a private registry (list of names).
# e.g. [ { name: ghcr-creds } ]
imagePullSecrets: []

# Non-secret configuration. Rendered into a ConfigMap and injected via envFrom.
config:
  # -- TLS is terminated in front of the app (Ingress / load balancer).
  # Set to "false" only if the app itself terminates TLS. Always emitted.
  tlsOffload: true

  # -- Object store backend: "filesystem" (mounted volume) or "s3". Always emitted.
  storage: filesystem
  # -- Filesystem object-store path (used when storage == filesystem). Mount point
  # of the object-store PVC.
  storagePath: /data/object-store

  # S3 object store (used when storage == s3). Credentials live under secrets.s3.
  s3:
    # -- S3-compatible endpoint URL (leave empty for AWS default).
    endpoint: ""
    # -- S3 bucket name.
    bucket: ""
    # -- S3 region.
    region: ""

  # OIDC single sign-on (optional). Client secret lives under secrets.oidc.
  oidc:
    # -- OIDC authority / issuer URL. Leave empty to disable OIDC.
    authority: ""
    # -- OIDC client id.
    clientId: ""

  # -- OpenTelemetry OTLP endpoint (e.g. http://otel-collector:4317). Leave empty
  # to disable telemetry export.
  otlpEndpoint: ""

  # -- KEK pointer for the envelope-encryption store (TASK-767): "none" (demo/throwaway — DEK stored
  # plaintext), "local:<base64-32-byte-key>", "awskms:<arn>", "azurekv:<key-url>", "gcpkms:<name>", or
  # "pkcs11:module=<path>;slot=<n>|token=<label>;label=<keylabel>" for an HSM/Cryptoki backend. This
  # string is NON-SECRET by design — it never contains key material, only a pointer to where the key
  # lives. Leave empty to disable KEK/DEK provisioning entirely (no field-level secret store).
  # Pair with secrets.kekPin when the pkcs11 backend needs a token PIN.
  kekPointer: ""

  # -- NATS connection URL. Only used when nats.enabled is false. When the bundled
  # NATS is enabled, the in-cluster service DNS is used automatically.
  natsUrl: ""

  # -- Optional primodel.toml content (TASK-767), rendered into a ConfigMap and mounted at
  # /etc/primodel/primodel.toml — the ConfigMap-overlay layer in the app's config precedence chain:
  #   base image primodel.toml < /etc/primodel/primodel.toml (THIS) < /mnt/primodel/primodel.toml
  #   < PRIMODEL_* env vars < DB runtime_settings
  # Use it for settings with no PRIMODEL_* env var mapping (e.g. [Scheduler] PollSeconds) — those
  # only reach the app through a TOML layer or the DB. Leave empty ("") to skip mounting an
  # overlay and rely on the base image defaults + PRIMODEL_* env vars above.
  #
  # TOML SCOPING GOTCHA: a bare key belongs to the MOST RECENT [Table] header above it, and
  # comments do NOT re-scope — put every root-level key ABOVE the first [Table] header, or it
  # silently gets absorbed into that table (this exact mistake made the app unstartable once:
  # AllowedHosts landed as Logging:LogLevel:AllowedHosts and the logging filter threw on it).
  #
  # Example:
  #   tomlOverlay: |
  #     [Scheduler]
  #     PollSeconds = 10
  tomlOverlay: ""

# Sensitive configuration. Rendered into a Secret and injected via envFrom, unless
# existingSecret is set (in which case that Secret is referenced instead).
secrets:
  # -- Name of a pre-existing Secret to use instead of creating one from the values
  # below. It must expose the PRIMODEL_* sensitive keys. Leave empty to have the
  # chart create the Secret.
  existingSecret: ""

  # -- PostgreSQL connection URL: postgres://user:pass@host:5432/db. REQUIRED unless
  # metadataSecretRef is set instead (two-phase startup, TASK-767) — when both are set,
  # metadataSecretRef takes over at boot and databaseUrl is ignored.
  databaseUrl: ""
  # -- Two-phase startup (TASK-767): resolve the metadata DB credential from a secret store instead
  # of databaseUrl above, e.g. "aws:primodel/metadata-db", "azurekv:https://v.vault.azure.net/secrets/db",
  # or a Kubernetes-Secret-backed ref. Leave empty to use databaseUrl directly (default).
  metadataSecretRef: ""
  # -- PIN for the pkcs11 KEK backend (config.kekPointer). Ignored by other backends / when
  # config.kekPointer is empty.
  kekPin: ""
  # -- Encryption key for data at rest (REQUIRED — the app refuses to start without
  # it, and rotating it makes previously encrypted data unreadable). Generate a
  # strong random value and keep it safe.
  encryptionKey: ""
  # -- Password for the bootstrap admin user seeded on first startup. If left empty,
  # a password is generated and printed to the application logs.
  bootstrapPassword: ""

  oidc:
    # -- OIDC client secret (used when config.oidc.authority is set).
    clientSecret: ""

  s3:
    # -- S3 access key (used when config.storage == s3).
    accessKey: ""
    # -- S3 secret key (used when config.storage == s3).
    secretKey: ""

# Bundled single-node NATS JetStream (message backbone). External NATS can be used
# by disabling this and setting config.natsUrl.
nats:
  # -- Deploy a single-node NATS JetStream StatefulSet as part of this release.
  enabled: true
  # -- NATS container image.
  image: nats:2.10
  persistence:
    # -- Persist JetStream data to a PersistentVolume.
    enabled: true
    # -- Size of the NATS data volume.
    size: 5Gi
    # -- StorageClass for the NATS data volume ("" uses the cluster default).
    storageClass: ""

# Persistent volume for the filesystem object store. Only used when
# config.storage == "filesystem".
persistence:
  # -- Create/mount a PVC for the object store.
  enabled: true
  # -- Size of the object-store volume.
  size: 10Gi
  # -- StorageClass ("" uses the cluster default).
  storageClass: ""
  # -- Access mode for the object-store volume.
  accessMode: ReadWriteOnce

# Worker Deployment (optional — for split api+worker topology).
# When enabled, the main Deployment becomes role=api and a second Deployment
# is created for role=worker. Both use the same image, ConfigMap, and Secret.
worker:
  # -- Deploy a separate role=worker Deployment alongside the role=api Deployment.
  # Default: false (single role=all Deployment).
  enabled: false

  # -- Number of worker replicas. Scale up for higher ingestion throughput.
  # Each replica claims independent NATS JetStream shard leases; no coordination
  # required — the lease manager handles exclusive ownership.
  replicaCount: 1

  # -- Resource requests/limits for the worker container (independent of api).
  resources: {}

  # -- Node selector for worker pods (e.g. to schedule on memory-optimised nodes).
  nodeSelector: {}

  # -- Tolerations for worker pods.
  tolerations: []

  # -- Affinity rules for worker pods.
  affinity: {}

  # HPA for the worker Deployment (optional).
  autoscaling:
    # -- Enable HPA for the worker Deployment.
    enabled: false
    # -- Minimum worker replicas.
    minReplicas: 1
    # -- Maximum worker replicas.
    maxReplicas: 5
    # -- Target CPU utilisation percentage (average across pods).
    targetCPUUtilizationPercentage: 70

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Service port (also the app's container port).
  port: 8080

ingress:
  # -- Expose the app through an Ingress.
  enabled: false
  # -- IngressClass name ("" leaves it unset / cluster default).
  className: ""
  # -- Extra annotations for the Ingress (e.g. cert-manager, nginx tuning).
  annotations: {}
  # -- Hostname to route to the app.
  host: primodel.example.com
  tls:
    # -- Terminate TLS at the Ingress using the secret below.
    enabled: false
    # -- Name of the TLS Secret (cert + key) for the host.
    secretName: ""

serviceAccount:
  # -- Create a ServiceAccount for the app.
  create: true
  # -- Name of the ServiceAccount ("" derives it from the release name).
  name: ""
  # -- Annotations for the ServiceAccount (e.g. EKS IRSA role ARN).
  annotations: {}

# -- Resource requests/limits for the app container.
resources: {}

# -- Node selector for the app pods.
nodeSelector: {}

# -- Tolerations for the app pods.
tolerations: []

# -- Affinity rules for the app pods.
affinity: {}

# -- Pod-level security context. fsGroup 1001 makes the mounted object-store volume
# group-writable for the non-root user. NOTE: OpenShift assigns its own fsGroup and
# ignores this value.
podSecurityContext:
  fsGroup: 1001

# -- Container-level security context. runAsUser is intentionally NOT set so the
# platform (e.g. OpenShift) can assign a UID; the image defaults to 1001.
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
