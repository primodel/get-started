# Required check: the SEC §2 security self-review in the PR description must be complete.
# Fails when the section is missing, when any checklist box is unticked, or when the threat
# consideration is empty. Re-runs when the description is edited. PRs opened by bots
# (Dependabot, release-please) are exempt: they don't use the template and are gated by the
# other required checks.
name: PR checklist

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  checklist:
    name: PR checklist
    runs-on: ubuntu-latest
    steps:
      - name: Security self-review is complete
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "Opened by a bot: checklist not required."
            exit 0
          fi
          body=$(printf '%s' "${BODY:-}" | tr -d '\r')
          # HTML comments are template guidance, not answers.
          visible=$(printf '%s' "$body" | perl -0pe 's/<!--.*?-->//gs')
          fail=0
          if ! printf '%s\n' "$visible" | grep -q '^## Security self-review'; then
            echo "::error::The description has no '## Security self-review' section. Use the PR template."
            fail=1
          fi
          unticked=$(printf '%s\n' "$visible" | grep -E '^\s*[-*] \[ \]' || true)
          if [ -n "$unticked" ]; then
            echo "::error::Unticked checklist items. Tick every item; for one that doesn't apply, tick it and write n/a."
            printf '%s\n' "$unticked"
            fail=1
          fi
          if ! printf '%s\n' "$visible" | grep -qE '^\s*[-*] \[[xX]\]'; then
            echo "::error::No ticked checklist items found."
            fail=1
          fi
          threat=$(printf '%s\n' "$visible" | awk '/^## Threat consideration/{f=1;next} /^## /{f=0} f' | tr -d '[:space:]')
          if [ -z "$threat" ]; then
            echo "::error::The threat consideration is empty. Write it, or 'Not a significant change'."
            fail=1
          fi
          exit $fail
