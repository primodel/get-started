# Primodel — local quickstart.
#
# One Primodel container (UI + REST + GraphQL + OpenAPI on a single port) plus its two required
# backing services: Postgres (canonical + metadata store) and NATS JetStream (ingestion queue,
# change events, GraphQL subscriptions). The object store defaults to the local filesystem on a
# volume, so no S3/MinIO is needed to get started — see README.md to switch to S3.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up -d
#   open http://localhost:8080
name: primodel

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-primodel}
    volumes:
      # postgres:18+ stores data in a version subdir; mount the parent, not …/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-primodel}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data"]   # JetStream, persisted
    volumes:
      - natsdata:/data
    restart: unless-stopped

  primodel:
    image: ${PRIMODEL_IMAGE:-ghcr.io/primodel/primodel:latest}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      # ── Required backing services ──
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-primodel};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Nats__Url: "nats://nats:4222"
      # ── Object store: local filesystem (default). Persisted on the objectstore volume. ──
      ObjectStore__UseFileSystem: "true"
      ObjectStore__FileSystemRoot: "/data/object-store"
      # ── Secrets ──
      # Field-level encryption key — REQUIRED. Generate a strong value (see .env.example). Changing it
      # later makes existing encrypted field values unreadable.
      Encryption__Key: "${PRIMODEL_ENCRYPTION_KEY:?set PRIMODEL_ENCRYPTION_KEY in .env — see .env.example}"
      # First-run only: seeds the initial "admin" user with this password. Ignored once a user exists.
      Auth__BootstrapPassword: "${PRIMODEL_BOOTSTRAP_PASSWORD:-}"
    volumes:
      - objectstore:/data/object-store
    ports:
      - "${PRIMODEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/app-info >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
  objectstore:
