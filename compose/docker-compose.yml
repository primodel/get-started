# Primodel — local quickstart.
#
# One Primodel container (UI + REST + GraphQL + OpenAPI on a single port) plus its two required
# backing services: Postgres (canonical + metadata store) and NATS JetStream (ingestion queue,
# change events, GraphQL subscriptions). The object store defaults to the local filesystem on a
# volume, so no S3/MinIO is needed to get started — see README.md to switch to S3.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up -d      # → http://localhost:8080
#
# For automatic HTTPS (Let's Encrypt via Caddy), point a public DNS name at this host, set
# PRIMODEL_DOMAIN + PRIMODEL_TLS_OFFLOAD=true in .env, then:
#   docker compose --profile tls up -d      # → https://your-domain
name: primodel

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-primodel}
    volumes:
      # postgres:18+ stores data in a version subdir; mount the parent, not …/data.
      # State is bind-mounted under ./data next to this compose file (not a shared named volume), so
      # each install directory is self-contained: a fresh dir is a fresh DB, parallel installs are
      # isolated, and deleting the dir removes the data. No cross-folder credential clashes.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-primodel}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data"]   # JetStream, persisted
    volumes:
      - ./data/nats:/data
    restart: unless-stopped

  primodel:
    image: ${PRIMODEL_IMAGE:-ghcr.io/primodel/primodel:latest}
    pull_policy: always   # always fetch the referenced tag so a stale local cache can't serve an old build
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      # ── Required backing services ──
      PRIMODEL_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-primodel}"
      PRIMODEL_NATS_URL: "nats://nats:4222"
      # ── Object store: local filesystem (default). Persisted under ./data/object-store. ──
      PRIMODEL_STORAGE: "filesystem"
      PRIMODEL_STORAGE_PATH: "/data/object-store"
      # ── Secrets ──
      # Field-level encryption key — REQUIRED. Generate a strong value (see .env.example). Changing it
      # later makes existing encrypted field values unreadable.
      PRIMODEL_ENCRYPTION_KEY: "${PRIMODEL_ENCRYPTION_KEY:?set PRIMODEL_ENCRYPTION_KEY in .env — see .env.example}"
      # First-run only: seeds the initial "admin" user with this password. Ignored once a user exists.
      PRIMODEL_BOOTSTRAP_PASSWORD: "${PRIMODEL_BOOTSTRAP_PASSWORD:-}"
      # ── Serving ──
      # Set true when a TLS terminator sits in front (the `tls` profile below, or your own ingress/LB) so
      # the app honours X-Forwarded-* and marks the auth cookie Secure.
      PRIMODEL_TLS_OFFLOAD: "${PRIMODEL_TLS_OFFLOAD:-false}"
    volumes:
      - ./data/object-store:/data/object-store
    ports:
      - "${PRIMODEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/app-info >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Opt-in TLS. `docker compose --profile tls up -d` puts Caddy in front with automatic HTTPS
  # (Let's Encrypt). Requires a public DNS name pointing at this host in PRIMODEL_DOMAIN and
  # PRIMODEL_TLS_OFFLOAD=true in .env. Caddy terminates TLS and reverse-proxies to primodel:8080.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      - primodel
    environment:
      # Optional here (compose interpolates every service regardless of profile, so a required-var guard
      # would break the default `docker compose up`). Set PRIMODEL_DOMAIN in .env before using the tls
      # profile — Caddy needs a public DNS name to obtain a certificate.
      PRIMODEL_DOMAIN: "${PRIMODEL_DOMAIN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data       # persisted certificates — keep this to avoid re-issuing on restart
      - ./data/caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

# No named volumes: all persistent state is bind-mounted under ./data next to this file (see each
# service). That keeps every install directory self-contained and avoids Docker's global, project-
# scoped named volumes silently persisting old credentials across re-runs and separate folders.
